name: Release

# Ein Tag wie v0.2.0 baut alle Programme und hängt sie mit Prüfsummen an eine Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make dist VERSION="${GITHUB_REF_NAME}"
      - name: Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* install/* \
            --title "${GITHUB_REF_NAME}" --generate-notes
